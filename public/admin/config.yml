# =============================================================
# Sveltia CMS 配置
# 兼容 Decap CMS / Netlify CMS 语法，性能更好且支持即时预览
# 后台地址：http://localhost:4321/admin/（本地）或 https://你的域名/admin/
# =============================================================

# ------------------------- 认证后端 -------------------------
backend:
  name: github
  # 内容仓库：<GitHub 用户名>/<仓库名>
  repo: fusifen/Cloudways
  branch: main
  # ⚠️ OAuth 代理地址。仅「线上后台」用 GitHub 登录时需要；
  #    本地编辑走 File System Access API，不依赖它。
  #    部署官方 Worker：https://github.com/sveltia/sveltia-cms-auth
  #    部署后把下面的地址替换为你的 Worker 域名。
  base_url: https://sveltia-cms-auth.fusifen.workers.dev
  # 如需改用 GitLab / Gitea，把 name 改成对应值即可
  # name: gitlab

# ------------------------- 本地编辑说明 -------------------------
# Sveltia CMS 不支持 Decap 的 local_backend 选项（配了会被忽略并告警），
# 它改用浏览器的 File System Access API 直接读写本地文件夹：
#   1. npm run dev  →  打开 http://localhost:4321/admin/
#   2. 点击「使用本地仓库」
#   3. 在弹出的目录选择框里选中项目根目录（含 src/content 的那一层）
# 之后就能直接编辑本地文件，保存即写入磁盘，无需额外启动任何服务。
# 注意：该能力依赖 Chromium 内核浏览器（Chrome / Edge），且仅在 localhost 下可用。

# ------------------------- 媒体库 -------------------------
media_folder: public/images/uploads
public_folder: /images/uploads
# 说明：媒体库保持默认实现即可。不要给默认媒体库传 config 参数，
# 否则部分版本的 CMS 会因配置校验失败而白屏。

# ------------------------- 站点信息（编辑界面提示） -------------------------
site_url: https://cloudways-guide.com
display_url: https://cloudways-guide.com
logo_url: /favicon.svg

# =============================================================
# 集合
# =============================================================
collections:
  # -----------------------------------------------------------
  # 文章
  # -----------------------------------------------------------
  - name: articles
    label: 文章
    label_singular: 文章
    folder: src/content/articles
    create: true
    delete: true
    slug: '{{slug}}'
    preview_path: 'articles/{{slug}}'
    summary: '{{title}}'
    sortable_fields: [pubDate, title, updatedDate]
    view_filters:
      - label: 仅草稿
        field: draft
        pattern: true
      - label: 精选文章
        field: featured
        pattern: true
      - label: 教程
        field: category
        pattern: tutorial
      - label: 评测
        field: category
        pattern: review
      - label: 对比
        field: category
        pattern: comparison
    fields:
      - name: title
        label: 标题
        widget: string
        hint: 建议 30–60 字，包含核心关键词

      - name: description
        label: 摘要
        widget: text
        hint: 用于列表页与搜索结果摘要，建议 80–160 字

      - name: pubDate
        label: 发布时间
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        picker_utc: true

      - name: updatedDate
        label: 更新时间
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        required: false
        hint: 内容有实质修改时填写，会显示在文章头部

      - name: author
        label: 作者
        widget: string
        default: Cloudways 指南编辑部

      - name: category
        label: 分类
        widget: select
        options:
          - { label: 教程, value: tutorial }
          - { label: 评测, value: review }
          - { label: 对比, value: comparison }
          - { label: 优惠, value: coupon }
          - { label: 搬家, value: migration }
          - { label: 常见问题, value: faq }

      - name: tags
        label: 标签
        widget: list
        required: false
        default: []
        hint: 用于标签页聚合，建议 2–5 个

      - name: heroImage
        label: 头图
        widget: image
        required: false
        choose_url: true
        hint: 建议尺寸 1200×630，WebP 格式

      - name: heroImageAlt
        label: 头图替代文本
        widget: string
        required: false
        hint: 无障碍与 SEO 需要，简述图片内容

      - name: affiliateNotice
        label: 显示推广披露
        widget: boolean
        default: true
        hint: 含 Cloudways 推广链接的文章建议保持开启

      - name: featured
        label: 设为精选
        widget: boolean
        default: false

      - name: draft
        label: 草稿（不发布）
        widget: boolean
        default: false

      - name: toc
        label: 显示目录
        widget: boolean
        default: true

      - name: locale
        label: 语言
        widget: select
        options:
          - { label: 简体中文, value: zh-CN }
          - { label: English, value: en }
        default: zh-CN

      - name: readingTime
        label: 阅读时长（分钟）
        widget: number
        required: false
        value_type: int
        min: 1
        max: 120
        hint: 留空则按正文字数自动估算

      - name: relatedProducts
        label: 关联产品
        widget: list
        required: false
        default: []
        hint: 填产品文件名（不含 .md），如 digitalocean、vultr

      - name: faqs
        label: 常见问题
        widget: list
        required: false
        default: []
        hint: 填写后会生成 FAQPage 结构化数据，利于搜索结果富摘要
        fields:
          - { name: question, label: 问题, widget: string }
          - { name: answer, label: 回答, widget: text }

      - name: seo
        label: SEO 设置
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: title, label: SEO 标题, widget: string, required: false }
          - { name: description, label: SEO 描述, widget: text, required: false }
          - { name: keywords, label: 关键词, widget: list, required: false, default: [] }
          - { name: ogImage, label: 分享图, widget: image, required: false, choose_url: true }
          - { name: noindex, label: 禁止索引, widget: boolean, default: false }

      - name: body
        label: 正文
        widget: markdown
        hint: 支持 Markdown 与代码块。二级标题会自动进入目录

  # -----------------------------------------------------------
  # 产品（云厂商）
  # -----------------------------------------------------------
  - name: products
    label: 云厂商产品
    label_singular: 云厂商
    folder: src/content/products
    create: true
    delete: false
    slug: '{{fields.provider}}'
    summary: '{{name}}（{{provider}}）'
    sortable_fields: [order, name]
    fields:
      - name: name
        label: 厂商名称
        widget: string
        hint: 展示用名称，如 DigitalOcean、Amazon AWS

      - name: provider
        label: 厂商标识
        widget: select
        hint: 决定 Logo、品牌色与 URL（/products/<标识>/）
        options:
          - { label: DigitalOcean, value: digitalocean }
          - { label: Amazon AWS, value: aws }
          - { label: Google Cloud, value: gcp }
          - { label: Linode (Akamai), value: linode }
          - { label: Vultr, value: vultr }

      - name: tagline
        label: 一句话卖点
        widget: string
        hint: 显示在产品卡片与详情页头部

      - name: description
        label: 详细介绍
        widget: text
        hint: 2–4 句，说明该厂商的定位与适用人群

      - name: logo
        label: Logo 路径
        widget: string
        default: /images/providers/digitalocean.svg
        hint: 静态资源路径，Logo 放在 public/images/providers/ 下

      - name: brandColor
        label: 品牌色
        widget: string
        default: '#2563eb'
        hint: 十六进制色值，用于标签与图表

      - name: datacenters
        label: 数据中心
        widget: list
        required: false
        default: []
        summary: '{{fields.city}}（{{fields.code}}）'
        fields:
          - { name: city, label: 城市, widget: string }
          - { name: country, label: 国家/地区, widget: string }
          - { name: code, label: 机房代号, widget: string, required: false }

      - name: plans
        label: 配置档位
        widget: list
        summary: '{{fields.name}} — ${{fields.monthlyPrice}}/月'
        hint: 至少填写一档。价格按美元计
        fields:
          - { name: name, label: 档位名称, widget: string, hint: 如「2GB 标准」 }
          - { name: sku, label: 产品代号, widget: string, required: false, hint: 用于转化追踪，如 do-2gb }
          - { name: vcpu, label: vCPU 核数, widget: number, value_type: int, min: 1 }
          - { name: ram, label: 内存（GB）, widget: number, value_type: float, min: 0.5 }
          - { name: storage, label: 存储（GB）, widget: number, value_type: int, min: 1 }
          - { name: bandwidth, label: 月流量（TB）, widget: number, value_type: float, min: 0.1 }
          - { name: hourlyPrice, label: 小时价（USD）, widget: number, value_type: float, min: 0 }
          - { name: monthlyPrice, label: 月费（USD）, widget: number, value_type: float, min: 0 }
          - { name: popular, label: 主推档位, widget: boolean, default: false }
          - { name: bestFor, label: 适合场景, widget: string, required: false }

      - name: scenarios
        label: 适用场景
        widget: list
        required: false
        default: []

      - name: highlights
        label: Cloudways 托管特色
        widget: list
        required: false
        default: []

      - name: pros
        label: 优点
        widget: list
        required: false
        default: []

      - name: cons
        label: 需要注意
        widget: list
        required: false
        default: []

      - name: rating
        label: 综合评分（0–5）
        widget: number
        value_type: float
        min: 0
        max: 5
        step: 0.1
        default: 4.5

      - name: recommendedFor
        label: 推荐给谁
        widget: string
        required: false

      - name: ctaPath
        label: 推广落地页路径
        widget: string
        default: /en/
        hint: >-
          Cloudways 站内相对路径（不要写完整链接，推广 ID 由站点统一注入）。
          只能填这些实测可用的值：/en/（首页·注册）、/en/pricing.php（定价）、
          /en/free-website-migration-service.php（迁移）、
          /en/free-wordpress-cache-plugin-breeze.php（Breeze）、/en/support.php（支持）。
          注意 Cloudways 是 .php 文件结构，写 /en/pricing/ 这种目录形式会 404。

      - name: featured
        label: 首页推荐
        widget: boolean
        default: false

      - name: order
        label: 排序权重
        widget: number
        value_type: int
        default: 99
        hint: 数值越小越靠前

      - name: priceCheckedAt
        label: 价格核对日期
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        required: false
        hint: 每次更新价格后请同步修改，页面会展示此日期

      - name: seo
        label: SEO 设置
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: title, label: SEO 标题, widget: string, required: false }
          - { name: description, label: SEO 描述, widget: text, required: false }
          - { name: keywords, label: 关键词, widget: list, required: false, default: [] }
          - { name: ogImage, label: 分享图, widget: image, required: false, choose_url: true }
          - { name: noindex, label: 禁止索引, widget: boolean, default: false }

      - name: body
        label: 详细介绍正文
        widget: markdown
        required: false
        hint: 支持 Markdown。二级标题会进入页面导航
